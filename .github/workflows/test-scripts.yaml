on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/test-scripts.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/scripts/**"
      - ".github/workflows/test-scripts.yaml"

name: Test scripts

jobs:
  zenodo:
    name: Zenodo pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install cURL headers
        run: |
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The tests are hermetic and need nothing from renv, so they install
      # what they need directly and skip .Rprofile, which would otherwise
      # activate renv and hide these packages.
      # Skipping .Rprofile also skips the repo setup-r writes there, so the
      # mirror it exports as RSPM is set explicitly.
      - name: Install dependencies
        run: |
          Rscript --no-init-file \
            -e 'options(repos = c(CRAN = Sys.getenv("RSPM", "https://cloud.r-project.org")))' \
            -e 'install.packages(c("httr2", "rmarkdown", "testthat", "withr"))'

      - name: Run tests
        run: Rscript --no-init-file .github/scripts/tests/run.R
